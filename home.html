
<!DOCTYPE html>
<html>

<head>

    <title>Employee Management - Home</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f2f6ff;
        }

        nav {
            background: #1e4fa3;
            padding: 20px;
            display: flex;
            align-items: center;
        }

        .logo {
            color: white;
            font-size: 24px;
            font-weight: bold;
            margin-right: 40px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-right: 25px;
            font-size: 17px;
        }

        nav a:hover {
            text-decoration: underline;
        }

        .content {
            text-align: center;
            padding: 100px 20px;
        }

        .content h1 {
            color: #1e4fa3;
            font-size: 42px;
            margin-bottom: 20px;
        }

        .content p {
            font-size: 20px;
        }

        .buttons {
            margin-top: 40px;
        }

        .buttons a {
            display: inline-block;
            background: #1e4fa3;
            color: white;
            text-decoration: none;
            padding: 14px 25px;
            margin: 10px;
            border-radius: 5px;
        }

    </style>

</head>

<body>

    <nav>

        <div class="logo">
            Employee Management
        </div>

        <a href="/">Home</a>

        <a href="/search">Search</a>

        <a href="/employee">Employee</a>

        <a href="/add_employee">Add Employee</a>

        <a href="/register">Register</a>

        <a href="/login">Login</a>

    </nav>


    <div class="content">

        <h1>Employee Management System</h1>

        <p>
            Welcome to Employee Management System
        </p>

        <div class="buttons">

            <a href="/employee">
                View Employee
            </a>

            <a href="/add_employee">
                Add Employee
            </a>

            <a href="/search">
                Search Employee
            </a>

        </div>

    </div>

</body>

</html>
