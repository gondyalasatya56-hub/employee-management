
<!DOCTYPE html>
<html>

<head>

    <title>Add Employee</title>

    <style>

        body {
            font-family: Arial;
            background: #f2f6ff;
            margin: 0;
        }

        nav {
            background: #1e4fa3;
            padding: 20px;
            display: flex;
            align-items: center;
        }

        .logo {
            color: white;
            font-size: 24px;
            font-weight: bold;
            margin-right: 40px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-right: 25px;
        }

        .container {
            width: 500px;
            margin: 50px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px #ccc;
        }

        h1 {
            text-align: center;
            color: #1e4fa3;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #1e4fa3;
            color: white;
            border: none;
            cursor: pointer;
        }

    </style>

</head>

<body>

    <nav>

        <div class="logo">
            Employee Management
        </div>

        <a href="/">Home</a>
        <a href="/search">Search</a>
        <a href="/employee">Employee</a>
        <a href="/add_employee">Add Employee</a>
        <a href="/register">Register</a>
        <a href="/login">Login</a>

    </nav>


    <div class="container">

        <h1>Add Employee</h1>

        <form method="POST">

            <input
                type="text"
                name="name"
                placeholder="Employee Name"
                required
            >

            <input
                type="email"
                name="email"
                placeholder="Email"
                required
            >

            <input
                type="text"
                name="phone"
                placeholder="Phone Number"
                required
            >

            <input
                type="text"
                name="department"
                placeholder="Department"
                required
            >

            <input
                type="number"
                name="salary"
                placeholder="Salary"
                required
            >

            <button type="submit">
                Add Employee
            </button>

        </form>

    </div>

</body>

</html>
