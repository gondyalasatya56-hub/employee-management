<!DOCTYPE html>
<html>

<head>

    <title>Login 🔐</title>

    <style>

        body {
            margin: 0;
            font-family: Arial;
            background: #f4f7f8;
            color: #222;
            transition: 0.3s;
        }

        .login-container {
            width: 420px;
            margin: 60px auto;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
        }

        h1 {
            text-align: center;
            color: rgb(55,116,116);
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: rgb(55,116,116);
        }

        .login-btn {
            width: 100%;
            margin-top: 25px;
            padding: 13px;
            background: rgb(55,116,116);
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        .login-btn:hover {
            background: rgb(40,90,90);
        }

        .register-link {
            text-align: center;
            margin-top: 20px;
        }

        .register-link a {
            color: rgb(55,116,116);
            font-weight: bold;
            text-decoration: none;
        }

        .error {
            text-align: center;
            color: red;
            font-weight: bold;
        }


        /* DARK MODE */

        body.dark-mode {
            background: #121212;
            color: white;
        }

        body.dark-mode .login-container {
            background: #1e1e1e;
            color: white;
        }

        body.dark-mode h1 {
            color: #8fd0d0;
        }

        body.dark-mode label {
            color: white;
        }

        body.dark-mode input {
            background: #2b2b2b;
            color: white;
            border-color: #555;
        }

        body.dark-mode input::placeholder {
            color: #bbb;
        }

        body.dark-mode .register-link a {
            color: #8fd0d0;
        }

    </style>

</head>


<body>

    {% include "navbar.html" %}


    <div class="login-container">

        <h1>Login 🔐</h1>


        {% if error %}

        <div class="error">
            {{ error }}
        </div>

        {% endif %}


        <form method="POST">

            <label>Username</label>

            <input
                type="text"
                name="username"
                placeholder="Enter username"
                required
            >


            <label>Password</label>

            <input
                type="password"
                name="password"
                placeholder="Enter password"
                required
            >


            <button type="submit" class="login-btn">
                Login 🔐
            </button>

        </form>


        <div class="register-link">

            Don't have an account?

            <a href="{{ url_for('register') }}">
                Register 📝
            </a>

        </div>

    </div>

</body>

</html>
