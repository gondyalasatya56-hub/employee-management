<!DOCTYPE html>
<html>

<head>

    <title>Home🏠</title>

    <style>

        body {

            margin:0;

            font-family: Arial;

            background: #f4f7f8;
        }


        .hero {

            text-align: center;

            padding: 80px 20px;
        }


        h1 {

            color: rgb(55, 116, 116);

            font-size: 45px;
        }


        p {

            font-size: 20px;

            color: #555;
        }


        .welcome {

            color: rgb(55, 116, 116);

            font-size: 22px;

            font-weight: bold;

            margin: 20px;
        }


        .buttons a {

            display: inline-block;

            background: rgb(55, 116, 116);

            color: white;

            text-decoration: none;

            padding: 14px 25px;

            margin: 10px;

            border-radius: 7px;
        }


        .buttons a:hover {

            background: rgb(40, 90, 90);
        }
       /* LIGHT MODE */
body {
    background-color: #f5f8fc;
    color: #222;
    transition: background-color 0.3s ease, color 0.3s ease;
}

/* DARK MODE */
body.dark-mode {
    background-color: #121212;
    color: #ffffff;
}

/* Dark mode for common page sections */
body.dark-mode .container,
body.dark-mode .card,
body.dark-mode .form-container,
body.dark-mode .employee-container {
    background-color: #1e1e1e;
    color: #ffffff;
}

/* Dark mode for headings and paragraphs */
body.dark-mode h1,
body.dark-mode h2,
body.dark-mode h3,
body.dark-mode p,
body.dark-mode label {
    color: #ffffff;
}

/* Dark mode for input boxes */
body.dark-mode input,
body.dark-mode select,
body.dark-mode textarea {
    background-color: #2b2b2b;
    color: #ffffff;
    border-color: #555;
}

body.dark-mode input::placeholder {
    color: #bbbbbb;
}
    </style>

</head>


<body>

    {% include "navbar.html" %}
   


    <div class="hero">

        <h1>
            Employee Management System👥
        </h1>


        {% if session.get("fullname") %}

        <div class="welcome">

            Welcome👏, {{ session["fullname"] }}!

        </div>

        {% endif %}


        <p>
            Manage employee information easily and efficiently🙌
        </p>


        <div class="buttons">

            <a href="{{ url_for('employee') }}">
                View Employees👀
                
            </a>


           

        </div>

    </div>
<script>
function darkMode() {
    document.body.classList.add("dark-mode");
    localStorage.setItem("theme", "dark");
}

function lightMode() {
    document.body.classList.remove("dark-mode");
    localStorage.setItem("theme", "light");
}

window.addEventListener("DOMContentLoaded", function() {
    if (localStorage.getItem("theme") === "dark") {
        document.body.classList.add("dark-mode");
    }
});
</script>
</body>
</html>
