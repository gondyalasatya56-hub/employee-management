<!DOCTYPE html>
<html>

<head>

    <title>Employee Management System</title>

    <style>

        body {
            margin: 0;
            font-family: Arial;
            background: #f4f7f8;
        }

        .container {
            width: 420px;
            margin: 150px auto;
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
        }

        h1 {
            color: rgb(55,116,116);
            margin-bottom: 10px;
        }

        p {
            color: #555;
            font-size: 18px;
            margin-bottom: 30px;
        }

        .btn {
            display: inline-block;
            padding: 14px 30px;
            margin: 10px;
            background: rgb(55,116,116);
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-size: 17px;
            font-weight: bold;
        }

        .btn:hover {
            background: rgb(40,90,90);
        }

    </style>

</head>

<body>

    <div class="container">

        <h1>Employee Management System 👥</h1>

        <p>Welcome! Please Register or Login to continue.</p>

        <a href="{{ url_for('register') }}" class="btn">
            Register 📝
        </a>

        <a href="{{ url_for('login') }}" class="btn">
            Login 🔐
        </a>

    </div>

</body>

</html>
