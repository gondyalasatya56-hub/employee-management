<!DOCTYPE html>
<html>

<head>

    <title>Register</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7f8;
        }

        .container {
            width: 380px;
            margin: 50px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }

        h1 {
            text-align: center;
            color: rgb(55, 116, 116);
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            margin-top: 7px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: rgb(55, 116, 116);
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 25px;
            background: rgb(55, 116, 116);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: rgb(40, 90, 90);
        }

        .message {
            text-align: center;
            color: red;
            font-weight: bold;
            margin-top: 15px;
        }

        .link {
            text-align: center;
            margin-top: 20px;
        }

        .link a {
            color: rgb(55, 116, 116);
            font-weight: bold;
            text-decoration: none;
        }

        .link a:hover {
            text-decoration: underline;
        }

    </style>

</head>


<body>

    {% include "navbar.html" %}


    <div class="container">

        <h1>📝 Register</h1>


        <form action="{{ url_for('register') }}" method="POST">

            <label>
                Full Name
            </label>

            <input
                type="text"
                name="fullname"
                placeholder="Enter full name"
                required>


            <label>
                Username
            </label>

            <input
                type="text"
                name="username"
                placeholder="Enter username"
                required>


            <label>
                Password
            </label>

            <input
                type="password"
                name="password"
                placeholder="Enter password"
                required>


            <button type="submit">
                📝 Register
            </button>

        </form>


        {% if error %}

        <p class="message">
            {{ error }}
        </p>

        {% endif %}


        <div class="link">

            Already have an account?

            <a href="{{ url_for('login') }}">
                🔐 Login
            </a>

        </div>

    </div>


    <script>

        function darkMode() {
            document.body.classList.add("dark-mode");
            localStorage.setItem("theme", "dark");
        }


        function lightMode() {
            document.body.classList.remove("dark-mode");
            localStorage.setItem("theme", "light");
        }


        window.addEventListener("DOMContentLoaded", function() {

            if (localStorage.getItem("theme") === "dark") {
                document.body.classList.add("dark-mode");
            }

        });

    </script>

</body>

</html>
